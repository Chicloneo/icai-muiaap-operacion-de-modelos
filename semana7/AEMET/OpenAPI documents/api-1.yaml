  /api/mapasygraficos/analisis:
    get:
      tags:
        - mapas-y-graficos
      summary: Mapas de análisis. Última pasada.
      description: "Estos mapas muestran la configuración de la presión en superficie
        usando isobaras (lineas de igual presión), áreas de alta (A, a) y baja
        (B, b) presión y los frentes en Europa y el Atlántico Norte.El mapa de
        análisis presenta el estado de la atmósfera a la hora correspondiente y
        los fenómenos más relevantes observados en España. Periodicidad de
        actualización: cada 12 horas (00, 12)."
      operationId: Mapas de análisis. Última pasada.
      responses:
        "200":
