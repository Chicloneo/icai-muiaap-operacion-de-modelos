      tags:
        - avisos_cap
      summary: Avisos de Fenómenos Meteorológicos Adversos. Último.
      description: " Últimos Avisos de Fenómenos Meteorológicos adversos elaborado
        para el área seleccionada."
      operationId: Avisos de Fenómenos Meteorológicos Adversos. Último.
      parameters:
        - name: area
          in: path
          description: |2-
             | Código | Área |
            |----------|----------|
            | esp  | España|
            | 61  | Andalucía   |
            | 62  | Aragón   |
            | 63  | Asturias, Principado de  |
            | 64  | Ballears, Illes   |
            | 78  | Ceuta   |
            | 65  | Canarias   |
            | 66  | Cantabria   |
            | 67  | Castilla y León   |
            | 68  | Castilla - La Mancha   |
            | 69  | Cataluña   |
            | 77  | Comunitat Valenciana   |
            | 70  | Extremadura   |
            | 71  | Galicia   |
            | 72  | Madrid, Comunidad de    |
            | 79  | Melilla   |
            | 73  | Murcia, Región de   |
            | 74  | Navarra, Comunidad Foral de   |
            | 75  | País Vasco |
            | 76  | Rioja, La
          required: true
          schema:
            type: string
      responses:
        "200":
          description: respuesta con éxito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/200"
        "400":
          description: petición incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        "401":
          description: petición no autorizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/401"
        "403":
          description: acceso denegado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/403"
        "404":
          description: petición sin datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/404"
        "429":
          description: petición que sobrepasa los límites del servicio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/429"
      security:
        - api_key: []
