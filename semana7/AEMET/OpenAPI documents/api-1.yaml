openapi: 3.0.1
info:
  title: Aemet OpenData
  description: Aemet OpenData es una API REST desarrollado por Aemet que permite
    la difusión y la reutilización de la información meteorológica y
    climatológica de la Agencia, en el sentido indicado en la Ley 18/2015, de 9
    de julio, por la que se modifica la Ley 37/2007, de 16 de noviembre, sobre
    reutilización de la información del sector público.
  contact:
    name: Datos abiertos Aemet
    url: https://www.aemet.es/es/datos_abiertos
  license:
    name: Condiciones de uso de reutilización
    url: https://www.aemet.es/es/nota_legal
  version: "2.0"
servers:
  - url: https://opendata.aemet.es/opendata
tags:
  - name: predicciones-especificas
    description: Predicciones Especificas
  - name: observacion-convencional
    description: Observacion Convencional
  - name: valores-climatologicos
    description: Valores Climatologicos
  - name: informacion-satelite
    description: Informacion Satelite
  - name: mapas-y-graficos
    description: Mapas Y Graficos
  - name: maestro
    description: Maestro
  - name: productos-climatologicos
    description: Productos Climatologicos
  - name: prediccion-maritima
    description: Prediccion Maritima
  - name: redes-especiales
    description: Redes Especiales
  - name: red-rayos
    description: Red Rayos
  - name: indices-incendios
    description: Indices Incendios
  - name: predicciones-normalizadas-texto
    description: Predicciones Normalizadas Texto
  - name: red-radares
    description: Red Radares
  - name: avisos_cap
    description: Avisos
  - name: antartida
    description: Antartida
