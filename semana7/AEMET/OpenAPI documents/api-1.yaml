  /api/observacion/convencional/mensajes/tipomensaje/{tipomensaje}:
    get:
      tags:
        - observacion-convencional
      summary: Mensajes de observación. Último elaborado.
      description: >-
        Últimos mensajes de observación. Para los SYNOP y TEMP devuelve los
        mensajes de las últimas 24 horas y para los CLIMAT de los 40 últimos
        dias. Se pasa como parámetro el tipo de mensaje que se desea
        (tipomensaje). El resultado de la petición es un fichero en formato
        tar.gz, que contiene los boletines en formato json y bufr.<br><br>
        [Canales RSS](https://opendata.aemet.es/centrodedescargas/rssatom)
        disponibles:
                <ul>
                <li>Observación convencional mensajes: climat</li>
                <li>Observación convencional mensajes: synop</li>
                <li>Observación convencional mensajes: temp</li>
                <li>Observación convencional mensajes: todos</li>
                </ul>
      operationId: Mensajes de observación. Último elaborado.
      parameters:
        - name: tipomensaje
          in: path
          description: |2-
             | Código | Tipo de Mensaje |
            |----------|----------|
            | climat  | climat   |
            | synop  | synop   |
            | temp  | temp  
          required: true
          schema:
            type: string
      responses:
