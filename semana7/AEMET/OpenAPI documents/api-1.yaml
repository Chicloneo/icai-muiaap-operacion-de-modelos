components:
  schemas:
    "200":
      required:
        - datos
        - descripcion
        - estado
        - metadatos
      type: object
      properties:
        descripcion:
          type: string
          default: Éxito
        estado:
          type: integer
        datos:
          type: string
        metadatos:
          type: string
    "400":
      required:
        - descripcion
        - estado
      type: object
      properties:
        descripcion:
          type: string
          default: Bad Request
        estado:
          type: integer
    "401":
      required:
        - descripcion
        - estado
      type: object
      properties:
        descripcion:
          type: string
          default: Unauthorized
        estado:
          type: integer
    "403":
      required:
        - descripcion
        - estado
      type: object
      properties:
        descripcion:
          type: string
          default: Forbidden
        estado:
          type: integer
    "404":
      required:
        - descripcion
        - estado
      type: object
      properties:
        descripcion:
          type: string
          default: Not Found
        estado:
          type: integer
    "429":
      required:
        - descripcion
        - estado
      type: object
      properties:
        descripcion:
          type: string
          default: Too Many Requests
        estado:
          type: integer
  securitySchemes:
    api_key:
      type: apiKey
      name: api_key
      in: header
