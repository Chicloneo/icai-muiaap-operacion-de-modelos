  /api/mapasygraficos/mapassignificativos/fecha/{fecha}/{ambito}/{dia}:
    get:
      tags:
        - mapas-y-graficos
      summary: Mapas significativos. Tiempo actual.
      description: Mapas significativos de ámbito nacional o CCAA, para una fecha dada
        y ese mismo día (D+0),  al día siguiente (D+1) o a los dos días (D+2),
        en el periodo horario de (00_12) ó (12-24). Hasta el 22/01/2020.
      operationId: Mapas significativos. Tiempo actual.
      parameters:
        - name: fecha
          in: path
          description: Fecha de elaboración (AAAA-MM-DD)
          required: true
          schema:
            type: string
        - name: ambito
          in: path
          description: |2-
             | Código | Ámbito |
            |----------|----------|
            | esp  | España|
            | and  | Andalucía   |
            | arn  | Aragón   |
            | ast  | Asturias  |
            | bal  | Ballears, Illes   |
            | coo  | Canarias   |
            | can  | Cantabria   |
            | cle  | Castilla y León   |
            | clm  | Castilla - La Mancha   |
            | cat  | Cataluña   |
            | val  | Comunitat Valenciana   |
            | ext  | Extremadura   |
            | gal  | Galicia   |
            | mad  | Madrid, Comunidad de    |
            | mur  | Murcia, Región de   |
            | nav  | Navarra, Comunidad Foral de   |
            | pva  | País Vasco |
            | rio  | Rioja, La
          required: true
          schema:
            type: string
        - name: dia
          in: path
          description: |2-
             | Código de día | Día |
            |----------|----------|
            | a | D+0 (00-12)  |
            | b  | D+0 (12-24)   |
            |  c | D+1 (00-12)  |
            | d  | D+1 (12-24) |
            | e  | D+2 (00-12) |
            | f  | D+2 (12-24)
          required: true
          schema:
            type: string
